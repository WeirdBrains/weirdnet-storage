[package]
name = "weirdnet-storage"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet storage: SQLCipher databases opened with a caller-supplied raw key, rekey and plaintext conversion, an ordered migration runner, savepoints, private files, snapshots and an optional row change log for sync."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-storage"
documentation = "https://docs.rs/weirdnet-storage"
readme = "README.md"
keywords = ["sqlite", "sqlcipher", "migrations", "sync", "storage"]
categories = ["database"]
include = ["src/**", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
default = ["sync", "vendored-openssl"]
# Build OpenSSL from source and link it statically into SQLCipher. Without it SQLCipher uses
# CommonCrypto on Apple targets (smaller, nothing bundled) and the system libcrypto elsewhere
# (OPENSSL_DIR, or pkg-config).
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Row change log, three-way merge decisions and row codecs for syncing databases.
sync = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:base64"]
# Primary and hot standbys from a hash-chained replication log, epochs, failover, fail-back.
replication = ["rusqlite/session", "dep:serde", "dep:serde_bytes", "dep:sha2"]
# Serve and follow the replication log over weirdnet-service sessions (weirdnet-net).
replication-service = ["replication", "dep:weirdnet-service"]
# weirdnet-sync majority-vote leases as replication leadership.
lease = ["replication", "dep:weirdnet-sync"]
# Retention policies, guard triggers, hash-chained seals, purge, archives.
retention = ["rusqlite/hooks", "dep:sha2"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher", "backup"] }
thiserror = "2"
zeroize = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
serde_bytes = { version = "0.11", optional = true }
weirdnet-service = { version = "0.1", default-features = false, optional = true }
weirdnet-sync = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[test]]
name = "replication"
required-features = ["replication"]

[[test]]
name = "service"
required-features = ["replication-service"]

[[test]]
name = "retention"
required-features = ["retention"]

[package.metadata.docs.rs]
features = ["sync", "vendored-openssl", "replication", "replication-service", "lease", "retention"]

# What the size report builds: as small as a release can be.
[profile.size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
